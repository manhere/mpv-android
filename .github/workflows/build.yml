name: build

on:
  - push
  - pull_request

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm cmake
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      # Unstripped copies of the native libs (Gradle strips libs when packing
      # the APKs). Used to symbolize crash backtraces / tombstones offline.
      - name: Collect unstripped native libs
        run: |
          mkdir -p native-symbols/arm64-v8a native-symbols/armeabi-v7a
          cp buildscripts/prefix/arm64/lib/*.so native-symbols/arm64-v8a/
          cp buildscripts/prefix/armv7l/lib/*.so native-symbols/armeabi-v7a/

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-native-symbols
          path: native-symbols
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-armeabi-v7a
          path: app/build/outputs/apk/default/debug/app-default-armeabi-v7a-debug.apk
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-v8a
          path: app/build/outputs/apk/default/debug/app-default-arm64-v8a-debug.apk
          archive: false
